[project]
name = "openops-platform"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "actionlint-py==1.7.12.25",
    "nodejs-wheel==24.19.0",
    "pymarkdownlnt==0.9.42",
    "ruff==0.17.6",
    "shellcheck-py==0.11.0.1",
    "tree-sitter==0.26.1",
    "tree-sitter-make==1.1.1",
    "yamllint==1.38.0",
]

[tool.uv]
# This repository uses Python tooling without itself being an installable Python app
package = false
required-version = "==0.13.9"

[tool.ruff]
# Match the Python version supported by this repository.
target-version = "py312"
# Use an 88-character preferred width when formatting code.
line-length = 88
# Exclude pinned upstream source during directory discovery.
extend-exclude = ["vendor"]

[tool.ruff.lint]
# Start with basic error checks and Pyflakes checks such as undefined names.
select = ["E4", "E7", "E9", "F"]
