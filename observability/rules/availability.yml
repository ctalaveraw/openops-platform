groups:
  - name: hello-world-availability
    interval: 1m
    rules:
      - record: openops:probe_success:current
        expr: probe_success{job="openops-http",instance="hello-world"}
      - alert: HelloWorldProbeUnavailable
        expr: >-
          (openops:probe_success:current == 0)
          or absent(probe_success{job="openops-http",instance="hello-world"})
        for: 2m
        labels:
          severity: warning
          owner: observability
        annotations:
          summary: Hello World probe unavailable
          description: Probe failed or telemetry is missing. Inspect probe and scrape health.
          runbook_url: https://github.com/ctalaveraw/openops-platform/blob/main/observability/docs/RUNBOOK.md
