name: Hello World image

"on":
  workflow_dispatch:
    inputs:
      operation:
        description: Validate the image or explicitly publish it
        type: choice
        required: true
        default: validate
        options:
          - validate
          - publish

permissions:
  contents: read

jobs:
  reject:
    name: Reject unauthorized publication
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'publish' &&
      (github.ref != 'refs/heads/main' ||
      github.repository != 'ctalaveraw/openops-platform')
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Reject request
        run: |
          echo 'Publication requires canonical main.' >&2
          exit 1

  verify:
    name: Build and smoke on request
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'validate'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check fixture and delivery prose
        run: |
          make -C apps/hello-world prose-check
          python3 vendor/slopmonster/deslop.py docs/delivery/hello-world.md

      - name: Run standalone application checks
        run: make -C apps/hello-world check

      - name: Build and smoke-test the image
        run: sh scripts/delivery/check_hello_image.sh

  publish:
    name: Test and publish from main
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'publish' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'ctalaveraw/openops-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check fixture and delivery prose
        run: |
          make -C apps/hello-world prose-check
          python3 vendor/slopmonster/deslop.py docs/delivery/hello-world.md

      - name: Run standalone application checks
        run: make -C apps/hello-world check

      - name: Build and smoke-test the image
        run: sh scripts/delivery/check_hello_image.sh

      - name: Publish the tested image to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REPO: ghcr.io/${{ github.repository }}-hello-world
          SOURCE_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker tag openops-hello-world:ci "$IMAGE_REPO:sha-$SOURCE_SHA"
          docker push "$IMAGE_REPO:sha-$SOURCE_SHA"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_REPO:sha-$SOURCE_SHA")
          test -n "$digest"
          printf 'Published image: %s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
