# Temporary fixture for the validation exercise.
name: Actions validation probe

# This probe has a manual trigger.
"on": workflow_dispatch

permissions:
  contents: read

env:
  # Deliberately misspelled property for actionlint to catch.
  PROBE_REVISION: ${{ github.not_a_real_property }}

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: printf '%s\n' "$PROBE_REVISION"
