name: Notification tools

"on":
  pull_request:
    paths:
      - scripts/notifications/**
      - tests/**
      - examples/notifications/**
      - docs/ci/zulip-notifications.md
      - .github/workflows/notifications-tests.yml
      - .python-version
      - pyproject.toml
      - uv.lock
  push:
    branches:
      - main
    paths:
      - scripts/notifications/**
      - tests/**
      - examples/notifications/**
      - docs/ci/zulip-notifications.md
      - .github/workflows/notifications-tests.yml
      - .python-version
      - pyproject.toml
      - uv.lock

permissions:
  contents: read

jobs:
  offline-tests:
    name: Notification tools (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version-file: pyproject.toml
          enable-cache: false

      - name: Prepare repository tooling
        run: make bootstrap

      # The suite supplies fake credentials and replaces HTTP with test responses.
      - name: Run notification tests without Zulip credentials
        run: .venv/bin/python -m unittest discover -s tests -v
